<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="player-wrapper">
      <div class="player-card">
        <div class="player-header">
          <span class="badge">NOW PLAYING</span>
        </div>

        <div class="album-art-container">
          <img
            id="cover-img"
            src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400&q=80"
            alt="Album Cover"
          />
          <div class="vinyl-dot"></div>
        </div>

        <div class="track-info">
          <h2 id="song-title">Loading...</h2>
          <p id="song-artist">Artist</p>
        </div>

        <div class="progress-section">
          <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="prev-btn" class="ctrl-btn" title="Previous Track">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button
            id="play-pause-btn"
            class="ctrl-btn play-btn"
            title="Play / Pause"
          >
            <i class="fa-solid fa-play" id="play-icon"></i>
          </button>
          <button id="next-btn" class="ctrl-btn" title="Next Track">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <div class="volume-section">
          <button id="mute-btn" class="vol-icon-btn" title="Mute / Unmute">
            <i class="fa-solid fa-volume-high" id="volume-icon"></i>
          </button>
          <input
            type="range"
            id="volume-slider"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
          <span id="volume-percent">80%</span>
        </div>
      </div>

      <div class="playlist-card">
        <div class="playlist-header">
          <h3><i class="fa-solid fa-list-ul"></i>CodeAlpha Playlist</h3>
          <span id="track-count">0 Tracks</span>
        </div>
        <ul id="playlist-list" class="playlist-list"></ul>
      </div>
    </div>

    <audio id="audio-player"></audio>

    <script src="script.js"></script>
  </body>
</html>
